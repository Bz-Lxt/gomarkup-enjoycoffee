upstream coffee_backend {
    # compose 服务名。nginx 在启动时解析一次即可 —— 后端容器重建后 IP 会变，
    # 但 compose 网络里服务名的解析是稳定的，且 backend 有 healthcheck 保证
    # nginx 启动时它已经在了。
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 上传/请求体上限。注水事件批量提交是这里最大的请求，远小于 1MB。
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- API 同源代理 ----
    #
    # 前端刻意不把后端地址烘焙进构建产物。烘焙的代价是产物与部署位置绑死：
    # VITE_API_BASE=http://localhost:31410 的镜像只有在正好发布到
    # localhost:31410 时才能用 —— 换端口、换域名、或者从另一台机器访问，
    # 前端就会去请求访问者自己的 31410 端口。
    #
    # 同源代理把这件事变成运行时决定：浏览器只知道 /api/...，
    # 由 nginx 转给它在 compose 网络里的邻居。附带好处是不再需要 CORS，
    # 而且容器内的 E2E 测试与用户浏览器走的是同一条路径。

    # WebSocket 必须比 /api/ 更具体地匹配，否则会落进下面那条通用规则、
    # 拿不到 Upgrade 头，握手直接失败。nginx 取最长前缀，所以这条优先。
    location /api/v1/ws/ {
        proxy_pass http://coffee_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 一条注水连接在用户闷蒸时可以几十秒没有任何消息。
        # 默认 60s 的读超时会把这种正常的静默判成断线。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 实时打点不能被缓冲，否则时间戳的意义就没了
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://coffee_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 带 hash 的资源可以长缓存：内容变了文件名就变了。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存。它是唯一引用带 hash 资源的入口，
    # 缓存它会让用户在新版本发布后仍然加载旧的 JS 文件名（已 404）。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA 兜底：/brew/12 这类前端路由在服务端没有对应文件，
    # 必须回落到 index.html 交给 react-router，否则刷新页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log off;
    error_log /var/log/nginx/error.log warn;
}
